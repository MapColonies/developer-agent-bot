# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
version: 2
updates:
  # deps
  - package-ecosystem: npm
    target-branch: 'master'
    schedule:
      interval: weekly
    allow:
      - dependency-type: production
    ignore:
      # express 5 needs @map-colonies/openapi-express-types to publish an
      # express-5 peer range first; until then npm ci fails with ERESOLVE.
      - dependency-name: 'express'
        update-types:
          - version-update:semver-major
    directory: /
    commit-message:
      prefix: 'deps'
    groups:
      map-colonies:
        patterns:
          - '@map-colonies/*'
      opentelemetry:
        patterns:
          - '@opentelemetry/*'
      patch:
        update-types:
          - patch
  # dev-deps
  - package-ecosystem: npm
    schedule:
      interval: weekly
    allow:
      - dependency-type: development
    ignore:
      # Paired with the express major above.
      - dependency-name: '@types/express'
        update-types:
          - version-update:semver-major
      # TypeScript 7 is the Go rewrite; the shared MapColonies configs and
      # openapi-typescript (peer typescript@^5.x) have to move first.
      - dependency-name: 'typescript'
        update-types:
          - version-update:semver-major
    directory: /
    commit-message:
      prefix: 'devdeps'
    groups:
      map-colonies:
        patterns:
          - '@map-colonies/*'
      opentelemetry:
        patterns:
          - '@opentelemetry/*'
      types:
        patterns:
          - '@types/*'
      dev-patch:
        update-types:
          - patch

  # github deps
  - package-ecosystem: github-actions
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
    directory: '/'
