on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # Fall back to the built-in token so the job still works if GH_PAT is unset.
          # Note: with the built-in token the release PR will not run the pull_request
          # checks, because events created by GITHUB_TOKEN do not trigger workflows.
          token: ${{ secrets.GH_PAT || github.token }}
