name: PR Author Auto Assign

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign-author:
    runs-on: ubuntu-latest
    steps:
      - uses: toshimaru/auto-author-assign@v3.1.0
        with:
          # Fall back to the built-in token so the job still works if GH_PAT is unset.
          repo-token: ${{ secrets.GH_PAT || github.token }}
