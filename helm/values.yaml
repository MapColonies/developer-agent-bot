global:
  cloudProvider: {}
  tracing: {}
  metrics: {}

mclabels:
  component: worker
  partOf: developer-agent-bot
  owner: common
  prometheus:
    enabled: true

enabled: true
replicaCount: 1
revisionHistoryLimit: 5  # Amount of revisions we keep
resetOnConfigChange: false

nameOverride: ""
fullnameOverride: ""

configManagement:
  offlineMode: false
  name: 'developer-agent-bot'
  version: 'latest'
  serverUrl: 'http://localhost:8080/api'

podAnnotations: {}

extraVolumes: []

extraVolumeMounts: []

extraEnvVars: []

command: []
args: []
# command: [ "/bin/sh", "-c", "--" ]
# args: [ "while true; do sleep infinity; done;" ]

sidecars: []

cloudProvider:
  dockerRegistryUrl: ''
  imagePullSecretName: ''
  flavor: openshift

caSecretName: ''
caPath: '/usr/local/share/ca-certificates'
caKey: 'ca.crt'

image:
  repository: developer-agent-bot
  # If commented, appVersion will be taken. See: _helpers.tpl
  # tag: 'latest'
  pullPolicy: IfNotPresent

# The worker is outbound-only: no Service, no Route, no Ingress, no probes.
worker:
  # In-cluster address of the self-hosted atlassian-write MCP server. The worker holds no
  # Jira credentials of its own — that server already has them.
  mcpUrl: 'http://mcp-atlassian:8080/mcp'
  # Who the worker claims tickets as. Two values because Jira takes an identifier on write
  # and returns a display name on read, and display names here are surname-first — the
  # optimistic claim's re-read compares against botDisplayName, so a mismatch between
  # these two makes every claim look lost.
  botAccount: ''
  botDisplayName: ''
  pollIntervalMs: 300000
  maxTicketsPerRun: 1
  maxConcurrentTickets: 1

  # Where the per-ticket clones are made. A writable emptyDir, because the worker now clones a
  # repository and runs its `npm ci` and its suite, and nothing on disk outlives a ticket.
  workspaceRoot: '/workspace'
  # Room for one clone plus its node_modules, times maxConcurrentTickets, with headroom. A
  # MapColonies service's node_modules is comfortably over 1Gi.
  workspaceSizeLimit: 8Gi

  # Spend ceilings (MAPCO-11435). Conservative on purpose: a metered API key has no ceiling of
  # its own, so these are the only thing between a stuck agent and an invoice. There is
  # deliberately no value meaning "unlimited" — a ceiling that can be switched off gets switched
  # off during an incident and stays off.
  maxTokensPerTicket: 200000
  maxTurnsPerTicket: 40
  maxTicketsPerDay: 5

  # Who the worker's commits are authored by. The real answer belongs to the GitHub App
  # (MAPCO-11428): `{app-slug}[bot]` and `{app-id}+{app-slug}[bot]@users.noreply.github.com`.
  # Until then this is a valid noreply address that is recognisably not a person's.
  gitName: 'mapcolonies-developer-agent[bot]'
  gitEmail: 'mapcolonies-developer-agent[bot]@users.noreply.github.com'

  # Model override. Empty means the worker's own default (agent/sdkOptions.ts).
  model: ''

  # The Anthropic API key. **Required** — the worker refuses to start without it, which is the
  # loudest thing a missing Secret can be. Never an interactive login: a run that billed a
  # person's account would look exactly like a working one.
  anthropicSecretName: ''
  anthropicSecretKey: 'apiKey'

  # The GitHub credential, used to look up repos, clone private ones, push and open the pull
  # request. Interim: MAPCO-11428 replaces this with App installation tokens minted per run, so
  # that there is no long-lived secret here at all.
  githubSecretName: ''
  githubSecretKey: 'token'

env:
  logLevel: info
  logPrettyPrintEnabled: false
  tracing:
    enabled: false
    url: http://localhost:55681/v1/trace
  metrics:
    enabled: false
    url: http://localhost:55681/v1/metrics

# Sized for what the worker actually does now: clone a repository, run its `npm ci` and then its
# test suite, next to an Agent SDK session. The previous 100m/128Mi was right for a pod that only
# polled Jira and would OOM-kill on the first `npm ci`.
resources:
  enabled: true
  value:
    limits:
      cpu: '2'
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi

