global:
  cloudProvider: {}
  tracing: {}
  metrics: {}

mclabels:
  component: worker
  partOf: developer-agent-bot
  owner: common
  prometheus:
    enabled: true

enabled: true
replicaCount: 1
revisionHistoryLimit: 5  # Amount of revisions we keep
resetOnConfigChange: false

nameOverride: ""
fullnameOverride: ""

configManagement:
  offlineMode: false
  name: 'developer-agent-bot'
  version: 'latest'
  serverUrl: 'http://localhost:8080/api'

podAnnotations: {}

extraVolumes: []

extraVolumeMounts: []

extraEnvVars: []

command: []
args: []
# command: [ "/bin/sh", "-c", "--" ]
# args: [ "while true; do sleep infinity; done;" ]

sidecars: []

cloudProvider:
  dockerRegistryUrl: ''
  imagePullSecretName: ''
  flavor: openshift

caSecretName: ''
caPath: '/usr/local/share/ca-certificates'
caKey: 'ca.crt'

image:
  repository: developer-agent-bot
  # If commented, appVersion will be taken. See: _helpers.tpl
  # tag: 'latest'
  pullPolicy: IfNotPresent

# The worker is outbound-only: no Service, no Route, no Ingress, no probes.
worker:
  # In-cluster address of the self-hosted atlassian-write MCP server. The worker holds no
  # Jira credentials of its own — that server already has them.
  mcpUrl: 'http://mcp-atlassian:8080/mcp'
  # Who the worker claims tickets as. Two values because Jira takes an identifier on write
  # and returns a display name on read, and display names here are surname-first — the
  # optimistic claim's re-read compares against botDisplayName, so a mismatch between
  # these two makes every claim look lost.
  botAccount: ''
  botDisplayName: ''
  pollIntervalMs: 300000
  maxTicketsPerRun: 1
  maxConcurrentTickets: 1
  # Which account the model calls are billed to. `api-key` reads ANTHROPIC_API_KEY from the
  # Secret below; `subscription` reads CLAUDE_CODE_OAUTH_TOKEN from it instead.
  #
  # `subscription` bills, and is rate-limited as, the person whose token it is. Anthropic's
  # Agent SDK documentation states that claude.ai login and its rate limits may not be used
  # for products built on the Agent SDK unless previously approved — setting this asserts
  # that this deployment has that approval. The worker and that person's own interactive use
  # also share one quota, and the pod will crash-loop when the token expires.
  modelAuth: 'api-key'
  # Secret holding the model credential. Key name must be `apiKey` for modelAuth: api-key,
  # or `oauthToken` for modelAuth: subscription. The pod will not start without it.
  modelSecretName: ''

env:
  logLevel: info
  logPrettyPrintEnabled: false
  tracing:
    enabled: false
    url: http://localhost:55681/v1/trace
  metrics:
    enabled: false
    url: http://localhost:55681/v1/metrics

resources:
  enabled: true
  value:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

