{{- $releaseName := .Release.Name -}}
{{- $chartName := include "developer-agent-bot.name" . -}}
{{- $cloudProviderFlavor := include "developer-agent-bot.cloudProviderFlavor" . -}}
{{- $cloudProviderDockerRegistryUrl := include "developer-agent-bot.cloudProviderDockerRegistryUrl" . -}}
{{- $cloudProviderImagePullSecretName := include "developer-agent-bot.cloudProviderImagePullSecretName" . -}}
{{- $imageTag := include "developer-agent-bot.tag" . -}}
{{- if .Values.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "developer-agent-bot.fullname" . }}
  labels:
    app: {{ $chartName }}
    component: {{ $chartName }}
    release: {{ $releaseName }}
    {{- include "developer-agent-bot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: {{ $chartName }}
      release: {{ $releaseName }}
      run: {{ include "developer-agent-bot.fullname" . }}
      {{- include "developer-agent-bot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: {{ $chartName }}
        release: {{ $releaseName }}
        run: {{ include "developer-agent-bot.fullname" . }}
        {{- include "developer-agent-bot.labels" . | nindent 8 }}
      annotations:
        {{ include "mclabels.annotations" . | nindent 8 }}
      {{- if .Values.resetOnConfigChange }}
        checksum/configmap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- end }}
      {{- if .Values.podAnnotations }}
      {{- toYaml .Values.podAnnotations | nindent 8 }}
      {{- end }}
    spec:
    {{- if $cloudProviderImagePullSecretName }}
      imagePullSecrets:
        - name: {{ $cloudProviderImagePullSecretName | quote }}
    {{- end }}
      containers:
        - name: {{ include "developer-agent-bot.fullname" . }}
          {{- with .Values.image }}
          image: {{ $cloudProviderDockerRegistryUrl }}{{ .repository }}:{{ $imageTag }}
          imagePullPolicy: {{ .pullPolicy | default "IfNotPresent" }}
          {{- end }}
          {{- if .Values.command }}
          command:
          {{- toYaml .Values.command | nindent 12 }}
          {{- if .Values.args }}
          args:
          {{- toYaml .Values.args | nindent 12 }}
          {{- end }}
          {{- end }}
          volumeMounts:
            # The per-ticket clones. Writable because the worker clones a repository and runs its
            # own `npm ci` and test suite in here; nothing in it outlives a ticket.
            - mountPath: {{ .Values.worker.workspaceRoot | quote }}
              name: workspace
            {{- if .Values.caSecretName }}
            - mountPath: {{ printf "%s/%s" .Values.caPath .Values.caKey | quote }}
              name: root-ca
              subPath: {{ quote .Values.caKey }}
            {{- end }}
            {{- if .Values.extraVolumeMounts -}}
              {{ toYaml .Values.extraVolumeMounts | nindent 12 }}
            {{- end }}
          env:
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: MCP_ATLASSIAN_URL
              value: {{ .Values.worker.mcpUrl | quote }}
            - name: JIRA_BOT_ACCOUNT
              value: {{ .Values.worker.botAccount | quote }}
            - name: JIRA_BOT_DISPLAY_NAME
              value: {{ .Values.worker.botDisplayName | quote }}
            - name: POLL_INTERVAL_MS
              value: {{ .Values.worker.pollIntervalMs | quote }}
            - name: MAX_TICKETS_PER_RUN
              value: {{ .Values.worker.maxTicketsPerRun | quote }}
            - name: MAX_CONCURRENT_TICKETS
              value: {{ .Values.worker.maxConcurrentTickets | quote }}
            - name: WORKSPACE_ROOT
              value: {{ .Values.worker.workspaceRoot | quote }}
            - name: MAX_TOKENS_PER_TICKET
              value: {{ .Values.worker.maxTokensPerTicket | quote }}
            - name: MAX_TURNS_PER_TICKET
              value: {{ .Values.worker.maxTurnsPerTicket | quote }}
            - name: MAX_TICKETS_PER_DAY
              value: {{ .Values.worker.maxTicketsPerDay | quote }}
            - name: AGENT_GIT_NAME
              value: {{ .Values.worker.gitName | quote }}
            - name: AGENT_GIT_EMAIL
              value: {{ .Values.worker.gitEmail | quote }}
            {{- if .Values.worker.model }}
            - name: AGENT_MODEL
              value: {{ .Values.worker.model | quote }}
            {{- end }}
            # Which account the model calls are billed to, stated rather than inferred. The
            # worker refuses to start on a credential its mode did not ask for, so this value
            # and the Secret's key below have to agree.
            - name: MODEL_AUTH
              value: {{ .Values.worker.modelAuth | quote }}
            {{- if .Values.worker.anthropicSecretName }}
            # The one credential the worker talks to the model with. Required: it refuses to
            # start without it rather than claiming a ticket and finding out — see
            # readModelCredential. The variable name is the mode's, never both at once.
            - name: {{ if eq .Values.worker.modelAuth "sdk" }}CLAUDE_CODE_OAUTH_TOKEN{{ else }}ANTHROPIC_API_KEY{{ end }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.worker.anthropicSecretName | quote }}
                  key: {{ .Values.worker.anthropicSecretKey | quote }}
            {{- end }}
            {{- if .Values.worker.githubSecretName }}
            # Repo lookups, the clone, the push and the pull request. MAPCO-11428 replaces this
            # with an App installation token minted per run.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.worker.githubSecretName | quote }}
                  key: {{ .Values.worker.githubSecretKey | quote }}
            {{- end }}
            {{- if .Values.caSecretName }}
            - name: REQUESTS_CA_BUNDLE
              value: {{ printf "%s/%s" .Values.caPath .Values.caKey | quote }}
            - name: NODE_EXTRA_CA_CERTS
              value: {{ printf "%s/%s" .Values.caPath .Values.caKey | quote }}
            {{- end }}
            {{- if .Values.extraEnvVars }}
            {{- toYaml .Values.extraEnvVars | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "developer-agent-bot.fullname" . }}
          {{- if .Values.resources.enabled }}
          resources:
            {{- toYaml .Values.resources.value | nindent 12 }}
          {{- end }}
        {{- if .Values.sidecars }}
        {{ tpl (toYaml .Values.sidecars) . | nindent 8 }}
        {{- end }}
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: {{ .Values.worker.workspaceSizeLimit | quote }}
        {{- if .Values.caSecretName }}
        - name: root-ca
          secret:
            secretName: {{ .Values.caSecretName }}
        {{- end }}
        {{- if .Values.extraVolumes -}}
          {{ tpl (toYaml .Values.extraVolumes) . | nindent 8 }}
        {{- end }}
{{- end -}}
